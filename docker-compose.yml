services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: agentcart-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/app:/app/app
      - ./backend/app/db/data:/app/app/db/data

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000

    container_name: agentcart-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped